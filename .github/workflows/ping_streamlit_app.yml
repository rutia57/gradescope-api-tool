name: Ping Streamlit app to keep it awake

on:
  schedule:
    - cron: '27 */3 * * *'
  workflow_dispatch:

jobs:
  check-app:
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: Install Playwright Chromium
        run: |
          playwright install chromium

      - name: Run Streamlit health check
        run: |
          for attempt in 1 2 3; do
            echo "=== Streamlit health check attempt $attempt/3 ==="
            if python .github/scripts/check_streamlit.py; then
              echo "Health check succeeded on attempt $attempt."
              exit 0
            fi
            echo "Health check failed on attempt $attempt."
            if [ "$attempt" -lt 3 ]; then
              echo "Retrying in 10 seconds..."
              sleep 10
            fi
          done
          echo "Health check failed after 3 attempts."
          exit 1

      - name: Send email on failure
        if: failure()
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python .github/scripts/send_failure_email.py